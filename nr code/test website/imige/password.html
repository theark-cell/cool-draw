<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Protected Website</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: #1f2937;
      padding: 35px;
      border-radius: 16px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 35px #0005;
    }

    h1 {
      margin-top: 0;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #4b5563;
      background: #111827;
      color: white;
    }

    button {
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #2563eb;
    }

    #message {
      color: #f87171;
    }

    #website {
      display: none;
      padding: 30px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="login-box" id="login">
    <h1>🔒 Private Website</h1>
    <p>Enter the password to continue.</p>

    <form id="passwordForm">
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >
      <button type="submit">Unlock Website</button>
    </form>

    <p id="message" role="alert"></p>
  </div>

  <div id="website">
    <h1>Welcome!</h1>
    <p>You have unlocked the website.</p>
    <p>Put your website content here.</p>
  </div>

  <script>
    const correctPassword = "bokoboy";

    document.getElementById("passwordForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        const enteredPassword =
          document.getElementById("password").value;

        if (enteredPassword === correctPassword) {
          window.location.replace("../drawing.html");
        } else {
          document.getElementById("message").textContent =
            "Incorrect password. Please try again.";
        }
      });
  </script>
  <a href="../drawing.html">Open main website</a>
</body>
</html>
